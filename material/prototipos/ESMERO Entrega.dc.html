<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Jost:wght@500&display=swap">
</helmet>
<div style="background:#EFE6E3;padding:60px;font-family:'Jost',sans-serif;color:#26161B;width:max-content">
<div style="display:flex;align-items:baseline;gap:24px;margin-bottom:40px">
<div style="font-family:'Cormorant Garamond',serif;font-size:64px;font-style:italic">ESMERO por Juliana Corrêa</div>
<div style="font-size:12px;letter-spacing:.24em;text-transform:uppercase">Entrega · desktop 1440 · celular 390 · <a href="site/index.html" target="_blank" style="color:#A8134A">abrir site completo</a></div>
</div>

<div style="font-size:12px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:16px">Desktop 1440</div>
<sc-for list="{{ desk }}" as="r" hint-placeholder-count="2">
<div style="display:flex;gap:40px;margin-bottom:40px">
<sc-for list="{{ r }}" as="f" hint-placeholder-count="3">
<div>
<div style="font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px">{{ f.label }}</div>
<iframe src="{{ f.src }}" style="width:1440px;height:900px;border:0;background:#fff;box-shadow:0 10px 40px rgba(38,22,27,.15)" loading="lazy"></iframe>
</div>
</sc-for>
</div>
</sc-for>

<div style="font-size:12px;letter-spacing:.24em;text-transform:uppercase;margin:60px 0 16px">Celular 390</div>
<div style="display:flex;gap:40px;align-items:flex-start">
<sc-for list="{{ mob }}" as="f" hint-placeholder-count="6">
<div>
<div style="font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px">{{ f.label }}</div>
<iframe src="{{ f.src }}" style="width:390px;height:844px;border:0;background:#fff;box-shadow:0 10px 40px rgba(38,22,27,.15)" loading="lazy"></iframe>
</div>
</sc-for>
</div>

<div style="font-size:12px;letter-spacing:.24em;text-transform:uppercase;margin:60px 0 16px">Botão: repouso e hover (passe o mouse)</div>
<div style="display:flex;gap:48px;background:#FBF8F6;padding:48px;width:max-content;align-items:center">
<div><div style="font-size:11px;letter-spacing:.2em;margin-bottom:12px;opacity:.7">REPOUSO</div>
<a style="display:inline-block;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#FBF8F6;background:#26161B;padding:17px 27px;border:1px solid #26161B;transition:all .5s" style-hover="background:#A8134A;border-color:#A8134A;letter-spacing:.24em">Quero meu arranjo da semana</a></div>
<div><div style="font-size:11px;letter-spacing:.2em;margin-bottom:12px;opacity:.7">HOVER (FIXO)</div>
<a style="display:inline-block;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#FBF8F6;background:#A8134A;padding:17px 27px;border:1px solid #A8134A">Quero meu arranjo da semana</a></div>
<div><div style="font-size:11px;letter-spacing:.2em;margin-bottom:12px;opacity:.7">LINHA</div>
<a style="display:inline-block;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#26161B;border:1px solid #26161B;padding:17px 27px;transition:all .5s" style-hover="background:#A8134A;border-color:#A8134A;color:#FBF8F6;letter-spacing:.24em">Quero um Essencial</a></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const b = 'site/index.html';
    const d = (l, h) => ({ label: l, src: b + '#' + h });
    return {
      desk: [
        [d('Abertura', 'topo'), d('Arranjos', 'arranjos'), d('Manifesto', 'esmero')],
        [d('Consultoria', 'consultoria'), d('Lições de uma flor (carrossel)', 'licoes'), d('Quem está por trás', 'juliana')]
      ],
      mob: [d('Abertura', 'topo'), d('Arranjos', 'arranjos'), d('Manifesto', 'esmero'), d('Consultoria', 'consultoria'), d('Lições (carrossel)', 'licoes'), d('Quem está por trás', 'juliana')]
    };
  }
}
</script>
</body>
</html>
